<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Yip</title>
  <defs>
    <linearGradient id="yip-tile" x1="0" y1="8" x2="0" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1D21"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <radialGradient id="yip-dot" cx="72" cy="128" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B70"/>
      <stop offset="1" stop-color="#E5484D"/>
    </radialGradient>
  </defs>
  <!-- Tile 240x240 at 8px margin, r56; 1px inner edge. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#yip-tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <!-- Group x 53-198 (145px, 60% of tile), 2.5px left of centre; centre line y=128. -->
  <circle cx="72" cy="128" r="19" fill="url(#yip-dot)"/>
  <circle cx="72" cy="128" r="18.5" fill="none" stroke="#C93A3F" stroke-opacity="0.4"/>
  <g fill="#B7BCC8">
    <rect x="109" y="105" width="14" height="46" rx="7" fill-opacity="0.85"/>
    <rect x="134" y="88" width="14" height="80" rx="7"/>
    <rect x="159" y="99" width="14" height="58" rx="7" fill-opacity="0.85"/>
    <rect x="184" y="112" width="14" height="32" rx="7" fill-opacity="0.85"/>
  </g>
</svg>
