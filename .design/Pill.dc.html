<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /* The floating pill as it currently ships: its own always-on-top window,
       sized to the state it is in, over a transparent backdrop (no blur). */
    :root {
      --ink:       #F2F3F5;                 /* YipIndicatorTimerBrush */
      --ink-2:     #C9CED8;
      --surface:   rgba(20,21,24,0.84);     /* YipIndicatorSurfaceBrush */
      --line:      rgba(255,255,255,0.075); /* YipIndicatorStrokeQuietBrush */
      --dot-live:  #E5484D;                 /* YipIndicatorDotLiveBrush */
      --dot-idle:  #767C8C;                 /* YipIndicatorDotIdleBrush */
      --mono: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); }
    a { color: #6B99FF; } a:hover { color: #9FBDFF; }

    .stage {
      width: 700px; height: 430px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 34px;
      background:
        radial-gradient(55% 45% at 20% 14%, #FFE8A8 0%, rgba(255,232,168,0) 62%),
        radial-gradient(50% 45% at 80% 30%, #FFB9CF 0%, rgba(255,185,207,0) 64%),
        linear-gradient(150deg, #F6C88A 0%, #E9A4B6 50%, #D8B487 100%);
    }
    .stage::after {
      content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
      background: repeating-linear-gradient(112deg, rgba(255,255,255,.22) 0 26px, rgba(0,0,0,.05) 26px 60px);
    }

    .slot { position: relative; display: flex; flex-direction: column;
            align-items: center; gap: 9px; }
    .cap { font-size: 10px; letter-spacing: 1.2px; color: rgba(40,28,26,.62);
           text-transform: uppercase; }

    /* The window IS the pill: it is resized per state and its region rounds it,
       so the radius is always half the height. */
    .pill {
      display: flex; align-items: center; position: relative;
      padding: 4px 10px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 22px rgba(0,0,0,.30);
    }
    .pill.rec { width: 210px; height: 44px; border-radius: 22px; }
    .pill.exp { width: 320px; height: 56px; border-radius: 28px; }
    .pill.save { width: 210px; height: 44px; border-radius: 22px; opacity: .85; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-live);
           flex: none; margin: 0 8px 0 2px; }
    .dot.quiet { background: var(--dot-idle); }

    /* 4 bars, 3px wide, 4px apart, 18px travel — the shipped geometry. */
    .meter { width: 36px; height: 22px; flex: none; display: flex; align-items: center;
             gap: 4px; }
    .meter i { width: 3px; border-radius: 1.5px; }

    .t { font-family: var(--mono); font-size: 13px; color: var(--ink);
         font-variant-numeric: tabular-nums; margin: 0 8px 0 10px; }
    .grow { flex: 1 1 auto; }

    .acts { display: flex; align-items: center; gap: 6px; flex: none; }
    .act { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
           color: var(--ink-2); background: rgba(255,255,255,0.07);
           box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); }
  </style>
</helmet>

<div class="stage">
  <div class="slot">
    <div class="pill rec">
      <div class="dot"></div>
      <div class="meter">
        <i style="height:9px;background:#3FC868"></i>
        <i style="height:15px;background:#4DCC68"></i>
        <i style="height:13px;background:#47CA69"></i>
        <i style="height:7px;background:#3AC66A"></i>
      </div>
      <div class="t">00:08</div>
      <div class="grow"></div>
    </div>
    <div class="cap">Recording &#183; window is 210 &#215; 44</div>
  </div>

  <div class="slot">
    <div class="pill exp">
      <div class="dot"></div>
      <div class="meter">
        <i style="height:11px;background:#43C969"></i>
        <i style="height:18px;background:#59D067"></i>
        <i style="height:14px;background:#4ACB68"></i>
        <i style="height:8px;background:#3CC669"></i>
      </div>
      <div class="t">00:08</div>
      <div class="grow"></div>
      <div class="acts">
        <div class="act">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>
        </div>
        <div class="act">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M6 9v6M18 9v6"></path></svg>
        </div>
        <div class="act">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h7l2 2.5h7M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-8"></path></svg>
        </div>
      </div>
    </div>
    <div class="cap">Expanded on tap &#183; window is 320 &#215; 56</div>
  </div>

  <div class="slot">
    <div class="pill save">
      <div class="dot quiet"></div>
      <div class="meter">
        <i style="height:2px;background:#35C46A"></i>
        <i style="height:2px;background:#35C46A"></i>
        <i style="height:2px;background:#35C46A"></i>
        <i style="height:2px;background:#35C46A"></i>
      </div>
      <div class="t" style="opacity:.75">00:08</div>
      <div class="grow"></div>
    </div>
    <div class="cap">Saving &#183; holds 350 ms, then hides</div>
  </div>
</div>
</x-dc>
</body>
</html>
