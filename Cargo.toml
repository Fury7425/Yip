[workspace]
resolver = "2"
members = ["audio-core"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `unwind`, not `abort`: every FFI entry point wraps `catch_unwind` and reports
# RecStatus::Panic. Under `abort` that net is dead code and a panic anywhere in
# audio-core takes the whole recorder down mid-session.
panic = "unwind"
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
debug = true
