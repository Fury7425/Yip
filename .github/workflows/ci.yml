name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WINDOWS_APP_SDK_VERSION: 1.6.250108002
  CPPWINRT_VERSION: 2.0.240405.15

jobs:
  rust:
    name: rust (audio-core)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: audio-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'src/**') }}
          restore-keys: target-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --release --no-fail-fast

      - name: Generate C header
        run: cargo build --release

      - name: Upload audio_core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio_core
          path: |
            audio-core/target/release/audio_core.lib
            audio-core/include/audio_core.h
          if-no-files-found: error
          retention-days: 7

  native:
    name: native (vst-host + yip-app)
    runs-on: windows-latest
    needs: rust
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.WINDOWS_APP_SDK_VERSION }}-${{ env.CPPWINRT_VERSION }}-${{ hashFiles('yip-app/yip-app.vcxproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo target (for cmake-driven build)
        uses: actions/cache@v4
        with:
          path: build/release/cargo-target
          key: cmake-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'audio-core/src/**') }}
          restore-keys: cmake-cargo-${{ runner.os }}-

      - name: cmake configure (release x64)
        run: cmake --preset release

      - name: cmake build
        run: cmake --build --preset release

      - name: Upload yip-app
        uses: actions/upload-artifact@v4
        with:
          name: yip-app-x64
          path: |
            build/release/yip-app/Release/**/*
          if-no-files-found: error
          retention-days: 14

  format-cpp:
    name: clang-format (yip-app + vst-host)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang-format)
        run: choco install llvm --no-progress --yes

      - name: Run clang-format --dry-run -Werror
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.h `
            -Path yip-app, vst-host |
            Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\Generated Files\\' }
          if ($files.Count -eq 0) {
            Write-Host "No C++ files to format-check."
            exit 0
          }
          & clang-format --dry-run -Werror --style=file $files.FullName
