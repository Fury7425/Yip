name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WINDOWS_APP_SDK_VERSION: 1.6.250108002
  CPPWINRT_VERSION: 2.0.240405.15

jobs:
  rust:
    name: rust (audio-core)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: audio-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'src/**') }}
          restore-keys: target-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --release --no-fail-fast

      - name: Generate C header
        run: cargo build --release

      - name: Upload audio_core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio_core
          path: |
            audio-core/target/release/audio_core.lib
            audio-core/include/audio_core.h
          if-no-files-found: error
          retention-days: 7

  native:
    name: native (vst-host + yip-app)
    runs-on: windows-latest
    needs: rust
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.WINDOWS_APP_SDK_VERSION }}-${{ env.CPPWINRT_VERSION }}-${{ hashFiles('yip-app/yip-app.vcxproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo target (for cmake-driven build)
        uses: actions/cache@v4
        with:
          path: build/release/cargo-target
          key: cmake-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'audio-core/src/**') }}
          restore-keys: cmake-cargo-${{ runner.os }}-

      - name: cmake configure (release x64)
        run: cmake --preset release

      - name: cmake build
        run: cmake --build --preset release

      - name: Upload yip-app
        uses: actions/upload-artifact@v4
        with:
          name: yip-app-x64
          path: |
            build/release/yip-app/Release/**/*
          if-no-files-found: error
          retention-days: 14

  native-arm64:
    name: native ARM64 (cross-compile)
    runs-on: windows-latest
    needs: rust
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # CMake passes --target aarch64-pc-windows-msvc for the ARM64 preset, so
      # the toolchain must carry that std. Without it the preset silently built
      # an x64 .lib and the link failed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-arm64-${{ runner.os }}-${{ env.WINDOWS_APP_SDK_VERSION }}-${{ env.CPPWINRT_VERSION }}-${{ hashFiles('yip-app/yip-app.vcxproj') }}
          restore-keys: nuget-arm64-${{ runner.os }}-

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cmake configure (release ARM64)
        run: cmake --preset release-arm64

      - name: cmake build
        run: cmake --build --preset release-arm64

      - name: Upload yip-app (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: yip-app-arm64
          path: |
            build/release-arm64/yip-app/Release/**/*
          if-no-files-found: error
          retention-days: 14

  installer:
    name: installer (Inno Setup, x64)
    runs-on: windows-latest
    needs: native
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download yip-app build
        uses: actions/download-artifact@v4
        with:
          name: yip-app-x64
          path: dist

      - name: Locate or install Inno Setup
        id: iscc
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile installer
        run: |
          New-Item -ItemType Directory -Force installer/out | Out-Null
          & "${{ steps.iscc.outputs.path }}" `
            "/DYipSourceDir=$((Resolve-Path dist).Path)" `
            "/DYipVersion=0.1.0" `
            "/DYipArch=x64" `
            installer/yip.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yip-setup-x64
          path: installer/out/*.exe
          if-no-files-found: error
          retention-days: 14

  format-cpp:
    name: clang-format (yip-app + vst-host)
    runs-on: windows-latest
    timeout-minutes: 5
    # Style-only check. Many WinRT/MIDL templates fight clang-format on first
    # write; treat as informational until the codebase has been swept locally
    # with `clang-format -i`. Flip back to a required check after the sweep.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang-format)
        run: choco install llvm --no-progress --yes

      - name: Run clang-format --dry-run -Werror
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cpp,*.h `
            -Path yip-app, vst-host |
            Where-Object { $_.FullName -notmatch '\\build\\' -and $_.FullName -notmatch '\\Generated Files\\' }
          if ($files.Count -eq 0) {
            Write-Host "No C++ files to format-check."
            exit 0
          }
          & clang-format --dry-run -Werror --style=file $files.FullName
